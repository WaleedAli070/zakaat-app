name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Node ESM smoke import of dist
        run: >-
          node -e "import('./packages/core/dist/index.js').then(m => { const h = m.gregorianToHijri('2019-07-03'); if (h.hy !== 1440 || typeof m.calculate !== 'function') process.exit(1); })"
